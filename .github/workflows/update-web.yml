name: Update website on release

on:
  # A release published by hand fires `release`. One created by release.yml
  # (with the workflow's own token) doesn't, so also run when that finishes.
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

jobs:
  update-web:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'release' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    steps:
      - name: Extract version and release notes
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed as env, never spliced into the script text.
          TAG: ${{ github.event.release.tag_name || github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected tag: $TAG"; exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.body' > /tmp/release_body.md

      - name: Clone web repo
        # WEB_REPO_PAT should be a fine-grained token limited to
        # bujna94/infinityTerminalWeb with Contents: read and write only.
        env:
          WEB_REPO_PAT: ${{ secrets.WEB_REPO_PAT }}
        run: |
          git clone "https://x-access-token:${WEB_REPO_PAT}@github.com/bujna94/infinityTerminalWeb.git" web

      - name: Update index.html
        env:
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          cd web
          python3 - "$VERSION" /tmp/release_body.md <<'PYEOF'
          import sys, re, html as htmllib
          from datetime import datetime, timezone

          version = sys.argv[1]
          with open(sys.argv[2]) as f:
              body = f.read()
          date = datetime.now(timezone.utc).strftime("%Y-%m-%d")

          with open("index.html") as f:
              html = f.read()

          # 1. softwareVersion in structured data
          html = re.sub(
              r'"softwareVersion":\s*"[^"]*"',
              f'"softwareVersion": "{version}"',
              html
          )

          # 2. datePublished in structured data
          html = re.sub(
              r'"datePublished":\s*"[^"]*"',
              f'"datePublished": "{date}"',
              html
          )

          # 3. Download section version line: <p id="version-tagline">v1.0.x — ...
          html = re.sub(
              r'(<p id="version-tagline">v)[0-9.]+',
              rf'\g<1>{version}',
              html
          )

          # 4. "What's New in v..." heading (handles both straight and curly apostrophes)
          html = re.sub(
              r"(What.s New in v)[0-9.]+",
              rf"\g<1>{version}",
              html
          )

          # 5. Build changelog <li> items from release body bullet points.
          # Require whitespace after the bullet character so we don't pick up
          # markdown bold like "**Full Changelog**: ..." which auto-generated
          # release bodies always include.
          items = []
          for line in body.splitlines():
              line = line.strip()
              if re.match(r'^[-*]\s+', line):
                  line = re.sub(r'^[-*]\s+', '', line)
                  # Escape first: release notes are text, never raw HTML.
                  line = htmllib.escape(line, quote=False)
                  # Convert **bold** to <strong>
                  line = re.sub(r'\*\*([^*]+)\*\*', r'<strong>\1</strong>', line)
                  # Convert `code` to <code>
                  line = re.sub(r'`([^`]+)`', r'<code>\1</code>', line)
                  items.append(f"                <li>{line}</li>")

          if items:
              items_html = "\n".join(items)
              html = re.sub(
                  r'(<ul class="tight" id="whats-new-list">)\s*?(<li>.*?</li>\s*?)+(\s*</ul>)',
                  rf'\1\n{items_html}\n              \3',
                  html,
                  count=1,
                  flags=re.DOTALL
              )

          with open("index.html", "w") as f:
              f.write(html)
          PYEOF

      - name: Commit and push
        env:
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          cd web
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update to v${VERSION}"
            git push
          fi
