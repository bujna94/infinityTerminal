name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

# Required so the release step can create the GitHub Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      # Actions are pinned to full commit hashes: a tag can be moved by its
      # owner, and these steps run while the signing identity is on the runner.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify version tag matches build-app.sh
        # Only enforce on tag pushes — workflow_dispatch from a branch has no
        # version semantics to check, and we still want it to exercise the
        # build / sign / notarize / upload-artifact pipeline for testing.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#v}"
          SCRIPT_VERSION=$(grep -E '^VERSION=' build-app.sh | head -1 | cut -d'"' -f2)
          if [ "$TAG_VERSION" != "$SCRIPT_VERSION" ]; then
            echo "Tag $TAG implies version $TAG_VERSION but build-app.sh has VERSION=\"$SCRIPT_VERSION\""
            exit 1
          fi
          echo "version=${SCRIPT_VERSION}" >> "$GITHUB_OUTPUT"
        id: version

      - name: Import Developer ID cert into a temporary keychain
        env:
          CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Prepend our keychain so codesign finds the Developer ID identity.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/cert.p12"
          # Confirm the identity is visible to codesign.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build, sign, notarize, staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          ./build-app.sh --dmg
          ls -la .build/*.dmg

      - name: Remove the signing keychain
        # Signing is done. Delete the keychain holding the Developer ID
        # identity before any other step runs, even if the build failed.
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-dmg
          path: .build/*.dmg
          # `.build` is a dotted directory; v4 excludes hidden paths by default.
          include-hidden-files: true

      - name: Prepare release notes body
        id: notes
        run: |
          set -euo pipefail
          # Use RELEASE_NOTES.md if you want real bullet points on the release
          # page (and on infinityterminal.com via update-web.yml). When absent,
          # action-gh-release just appends the auto-generated **Full Changelog**
          # link, which is harmless but uninformative.
          if [ -f RELEASE_NOTES.md ]; then
            echo "path=RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"
          else
            : > "$RUNNER_TEMP/notes.md"
            echo "path=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        # Uses the preinstalled gh CLI instead of a third-party action.
        # Re-running for an existing tag replaces the DMG and the notes.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" .build/*.dmg --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file "$NOTES" -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" .build/*.dmg --title "$TAG" \
              --notes-file "$NOTES" --generate-notes -R "$GITHUB_REPOSITORY"
          fi
